name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
            release: false
          - os: ubuntu-24.04
            python: '3.14.7'
            release: true
          - os: windows-2022
            python: '3.14.7'
            release: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Record Python runtime
        run: python -c 'import sys, zlib; print(sys.version); print("zlib", zlib.ZLIB_RUNTIME_VERSION)'
      - name: Check Lumen WQHD version and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/check_release.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release.py
          fi
      - name: Recreate Lumen WQHD
        run: python scripts/create_pack.py
      - name: Test Lumen Python code
        run: python -m unittest discover -s tests -v
      - name: Test build guards with Python optimization
        run: python -O -m unittest discover -s tests -p test_build_guards.py -v
      - name: Verify repeat build and independent source rebuild
        id: artifacts
        run: python scripts/verify_build.py --github-output "$GITHUB_OUTPUT"
      - name: Reject generated drift, including untracked files
        run: |
          drift="$(git status --porcelain --untracked-files=all -- pack docs/biome-map.json)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo 'Commit regenerated product files before releasing.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.release
        with:
          name: lumen-wqhd
          path: ${{ steps.artifacts.outputs.path }}/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate exact tag before creating release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Download Lumen WQHD artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name lumen-wqhd --dir release-assets
      - name: Verify complete product asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from artifacts import verify_bundle
          verify_bundle('release-assets', os.environ['RELEASE_TAG'].removeprefix('v'))
          PY
      - name: Create reviewable draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft --verify-tag --title "$RELEASE_TAG" \
            --notes 'Automatische Prüfungen erfolgreich. Vor Veröffentlichung die Windows-Abnahme für Lumen WQHD und die Release-Checkliste prüfen.'
